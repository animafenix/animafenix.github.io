<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMaps - Mapa</title>
    <link rel="icon" type="image/png" href="img/icons/mapita.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Libreria p5.js -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
</head>
<body class="page-map">

    <!-- Contenedor del Mapa -->
    <main id="map-container"></main>

    <!-- Barra de Navegacion Inferior -->
    <nav class="navbar fixed-bottom py-2">
        <div class="container-fluid justify-content-center gap-5">
            <a href="inicio.html" class="nav-icon-button" data-page="inicio" aria-label="Inicio">
                <img src="img/icons/casa.png" alt="" aria-hidden="true">
            </a>
            <a href="map.html" class="nav-icon-button" data-page="map" aria-label="Mapa">
                <img src="img/icons/mapita.png" alt="" aria-hidden="true">
            </a>
        </div>
    </nav>

    <!-- script del mapa -->
    <script src="sketch.js"></script>

    <script>
        const currentPage = window.location.pathname.split('/').pop() || 'inicio.html';
        const navButtons = document.querySelectorAll('.navbar .nav-icon-button');

        navButtons.forEach((button) => {
            const page = button.dataset.page;
            const isCurrentPage =
                (page === 'inicio' && currentPage === 'inicio.html') ||
                (page === 'map' && currentPage === 'map.html');

            button.classList.toggle('active', isCurrentPage);

            button.addEventListener('click', () => {
                navButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
            });
        });
    </script>
</body>
</html>
